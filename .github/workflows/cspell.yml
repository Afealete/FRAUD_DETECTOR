name: cSpell Spellcheck

on:
  push: {}
  pull_request: {}

jobs:
  cspell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
      - name: Install cspell
        run: npm install -g cspell
      - name: Run cspell
        run: cspell "**/*" --config .cspell.json || true
